# wallust configuration - for wallust version 3.0

# How the image is parse, in order to get the colors:
# full - resized - wal - thumb -  fastresize - kmeans
backend = "full"

# What color space to use to produce and select the most prominent colors:
# lab - labmixed - lch - lchmixed
# labmixed -> lch: less "muddy"/averaged picks, more true to the actual
# vivid hues present in the wallpaper.
color_space = "lch"

# NOTE: All filters will fill 16 colors (from color0 to color15), 16 color
#       variations are the 'ilusion' of more colors by opaquing color1 to color5.
# Use the most prominent colors in a way that makes sense, a scheme:
#  * dark        - 8 dark colors, dark background and light contrast
#  * dark16      - Same as `dark` but uses the 16 colors trick
#  * harddark    - Same as `dark` with hard hue colors
#  * harddark16  - Harddark with 16 color variation
#  * light       - Light bg, dark fg
#  * light16     - Same as `light` but uses the 16 color trick
#  * softdark    - Variant of softlight, uses the lightest colors and a dark
#                   background (could be interpreted as `dark` inversed)
#  * softdark16  - softdark with 16 color variation
#  * softlight   - Light with soft pastel colors, counterpart of `harddark`
#  * softlight16 - softlight with 16 color variation
palette = "softlight"

# Difference between similar colors, used by the colorspace:
#  1          Not perceptible by human eyes.
#  1 - 2      Perceptible through close observation.
#  2 - 10     Perceptible at a glance.
#  11 - 49    Colors are more similar than opposite
#  100        Colors are exact opposite
# Bumped from 11 -> 20: pulls the picks further apart from each other so
# waybar/mako/alacritty end up with a more differentiated set of accents
# instead of several near-identical hues from the same wallpaper region.
threshold = 20

# Boosts saturation of the final palette (1-100). Wallpapers with washed-out
# or low-contrast regions were producing fairly dull accents; this pushes
# them back toward the wallpaper's actual vividness. Lower this (or comment
# it out) if colors start looking oversaturated/artificial on some images.
saturation = 45

# Nudges any color that would end up too close to the background toward a
# more readable contrast, so accents don't disappear into background-alt.
check_contrast = true

[templates]
waybar.template = 'colors-waybar.css'
waybar.target = '~/.config/waybar/wallust-colors.css'

alacritty.template = 'colors-alacritty.toml'
alacritty.target = '~/.config/alacritty/colors.toml'

mako.template = 'colors-mako.ini'
mako.target = '~/.config/mako/wallust-colors'

# fuzzel reads this via an `include` in /etc/xdg/fuzzel/fuzzel.ini, which
# nixos-config generates (modules/nixos/desktop/theme.nix). Colors only --
# the layout stays declarative in the repo.
fuzzel.template = 'colors-fuzzel.ini'
fuzzel.target = '~/.config/fuzzel/wallust-colors.ini'

# niri. This target is not read by niri: it is a sed script that the renderer
# in modules/home/saeedp11/niri.nix applies to that module's config.kdl
# template to produce ~/.config/niri/config.kdl, because niri has no `include`
# and its configuration must be one file. A systemd user path unit watches
# this file, so writing it is what makes the focus ring follow the wallpaper.
niri.template = 'colors-niri.sed'
niri.target = '~/.config/niri/wallust-colors.sed'
